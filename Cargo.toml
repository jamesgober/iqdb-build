[package]
name    = "iqdb-build"
version = "0.6.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.87"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Parallel index construction, incremental updates, and merging - part of the iQDB family."

# Keywords (5 max)
keywords = [
    "index",
    "vector-search",
    "parallel",
    "construction",
    "iqdb"
]

# Categories
categories = [
    "algorithms",
    "concurrency"
]

# Links
homepage      = "https://github.com/jamesgober/iqdb-build"
repository    = "https://github.com/jamesgober/iqdb-build"
documentation = "https://docs.rs/iqdb-build"

# Authors
authors = [
    "James Gober <me@jamesgober.com>",
    "Matt Callahan <matthewcallahan01@icloud.com>"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `--cfg loom` is set by the loom CI job (and locally) to compile the loom model
# check in `tests/loom_iqdb_build.rs`. Register it so it is not flagged as an
# unexpected cfg under `-D warnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lib]
name = "iqdb_build"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
# The crate has no feature flags. It builds on `iqdb-index`, which is itself a
# pure, std-only trait crate, so there is no `no_std` split to gate and nothing
# optional to toggle. The default build is the whole surface.
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# The polymorphism layer: the `Index` / `IndexCore` traits the builder is
# generic over. Pulls in `iqdb-types` transitively.
iqdb-index = "1.0.0"
# Shared public vocabulary: VectorId, Metadata, DistanceMetric, IqdbError,
# Result. The builder propagates `iqdb-index` errors unchanged.
iqdb-types = "1.0.0"
# Data-parallel sharded construction. The whole point of this crate is the bulk
# path, so rayon is a core dependency, not an optional toggle: `build_parallel`
# splits input across a work-stealing pool and builds the shards concurrently.
rayon = "1"


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# Real `Index` backends, used only by the `real_backends` integration test to
# prove the generic builder constructs actual flat and HNSW indexes (not just the
# toy test index). Path-only dev-deps: dropped from the published manifest, so
# they never become a runtime/publish dependency.
iqdb-flat = { path = "../iqdb-flat" }
iqdb-hnsw = { path = "../iqdb-hnsw" }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"


# BENCHMARKS
# #################################
[[bench]]
name    = "build_bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
